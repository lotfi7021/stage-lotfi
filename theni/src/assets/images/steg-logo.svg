<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="400" height="200" fill="#ffffff"/>
  
  <!-- Courbe bleue principale -->
  <path d="M 120 50 Q 180 30 220 80 Q 240 110 220 140 Q 180 170 120 150" 
        fill="none" stroke="#1e5099" stroke-width="8" />
  
  <!-- Forme rouge en zigzag -->
  <path d="M 200 70 L 210 80 L 200 90 L 210 100 L 200 110 L 210 120 L 200 130" 
        fill="none" stroke="#e31e24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Texte principal -->
  <text x="200" y="170" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e5099">
    Société Tunisienne
  </text>
  
  <!-- Sous-texte -->
  <text x="200" y="190" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e5099">
    de l'Electricité et du Gaz
  </text>
</svg>